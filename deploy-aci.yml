api-version: 2025-07-15
location: francecentral
name: jobai-with-ssl
properties:
  containers:
  - name: nginx-with-ssl
    properties:
      image: mcr.microsoft.com/oss/nginx/nginx:1.15.5-alpine
      ports:
      - port: 443
        protocol: TCP
      resources:
        requests:
          cpu: 1.0
          memoryInGB: 1.5
      volumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx
  - name: jobai-backend
    properties:
      image: yotheblack/jobai-backend:latest
      ports:
      - port: 5000
        protocol: TCP
      resources:
        requests:
          cpu: 4.0
          memoryInGB: 8
  volumes:
  - secret:
      ssl.crt: 
      ssl.key: 
      nginx.conf: 
    name: nginx-config
  ipAddress:
    ports:
    - port: 443
      protocol: TCP
    type: Public
  osType: Linux
tags: null
type: Microsoft.ContainerInstance/containerGroups